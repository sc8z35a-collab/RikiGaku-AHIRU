<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%;
    background: #ffffff;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100vh;
    background: #ffffff;
    overflow: hidden;
  }
  #gl {
    display: block;
    width: 100%;
    height: 100%;
    background: #ffffff;
    cursor: grab;
    touch-action: none;
  }
  #gl:active { cursor: grabbing; }

  .dock {
    position: absolute;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid #e5e7eb;
    border-radius: 999px;
    box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 7px;
    z-index: 10;
  }
  #bottom-dock {
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    max-width: calc(100% - 24px);
    flex-wrap: nowrap;
  }
  #cam-dock {
    left: 12px;
    top: 12px;
  }
  #swatch-dock {
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    flex-direction: column;
    border-radius: 999px;
    padding: 7px 5px;
    gap: 6px;
  }

  .btn {
    width: 28px;
    height: 28px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: #334155;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    flex-shrink: 0;
  }
  .btn:hover { background: #f1f5f9; color: #0f172a; }
  .btn:active { transform: scale(0.93); }
  .btn.active {
    background: #0f172a;
    color: #ffffff;
  }
  .btn svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.85;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .sep {
    width: 1px;
    height: 16px;
    background: #e5e7eb;
    margin: 0 2px;
    flex-shrink: 0;
  }

  .slider-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 3px;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 68px;
    height: 4px;
    border-radius: 999px;
    background: #e2e8f0;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #0f172a;
    border: 2px solid #ffffff;
    box-shadow: 0 1px 4px rgba(15, 23, 42, 0.28);
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  input[type="range"]::-moz-range-thumb {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #0f172a;
    border: 2px solid #ffffff;
    box-shadow: 0 1px 4px rgba(15, 23, 42, 0.28);
    cursor: pointer;
  }
  #sl-throttle::-webkit-slider-thumb { background: #ea580c; }
  #sl-throttle::-moz-range-thumb { background: #ea580c; }

  .swatch {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 1.5px solid rgba(15, 23, 42, 0.18);
    cursor: pointer;
    transition: transform 0.14s ease, box-shadow 0.14s ease;
    position: relative;
  }
  .swatch:hover { transform: scale(1.22); }
  .swatch.selected {
    transform: scale(1.28);
    box-shadow: 0 0 0 2px #ffffff, 0 0 0 3.5px #0f172a;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>

  <div id="cam-dock" class="dock">
    <button class="btn active" id="cam-iso">
      <svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
    </button>
    <button class="btn" id="cam-side">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><line x1="12" y1="5" x2="12" y2="19" stroke-dasharray="2 2"/></svg>
    </button>
    <button class="btn" id="cam-front">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="9.5" cy="10.5" r="1" fill="currentColor"/><circle cx="14.5" cy="10.5" r="1" fill="currentColor"/><path d="M9.5 14.5h5"/></svg>
    </button>
    <button class="btn" id="cam-bottom">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 4v4.5M12 15.5V20M4 12h4.5M15.5 12H20"/></svg>
    </button>
    <button class="btn" id="cam-core">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/><path d="M11 8v6M8 11h6"/></svg>
    </button>
    <div class="sep"></div>
    <button class="btn" id="cam-reset">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>

  <div id="swatch-dock" class="dock"></div>

  <div id="bottom-dock" class="dock">
    <button class="btn active" id="btn-play">
      <svg id="ico-play" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/></svg>
    </button>
    <div class="sep"></div>

    <div class="slider-wrap">
      <button class="btn active" id="btn-explode">
        <svg viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      </button>
      <input id="sl-explode" type="range" min="0" max="100" value="36">
    </div>
    <div class="sep"></div>

    <div class="slider-wrap">
      <button class="btn active" id="btn-flame">
        <svg viewBox="0 0 24 24"><path d="M12 3c.5 4.2-3 5.5-3 9.2a5 5 0 0 0 10 0c0-3.2-2.2-5.4-3.2-7.2-.2 1.6-1.2 2.4-2.2 2.4.4-1.8-.3-3.2-1.6-4.4z"/></svg>
      </button>
      <input id="sl-throttle" type="range" min="0" max="100" value="72">
    </div>
    <div class="sep"></div>

    <button class="btn active" id="btn-shell">
      <svg id="ico-shell" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="btn" id="btn-cruise">
      <svg viewBox="0 0 24 24"><path d="M5 17L19 7"/><path d="M12 7h7v7"/><path d="M4 20h16"/></svg>
    </button>
    <button class="btn active" id="btn-flow">
      <svg viewBox="0 0 24 24"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 13h15a3 3 0 1 1-3 3"/><path d="M3 18h8a2.5 2.5 0 1 1-2.5 2.5"/></svg>
    </button>
    <button class="btn active" id="btn-edges">
      <svg viewBox="0 0 24 24"><polygon points="12 2 21 7 21 17 12 22 3 17 3 7 12 2"/><polyline points="3 7 12 12 21 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>
    </button>
  </div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, powerPreference: 'high-performance' })
          || canvas.getContext('webgl', { antialias: true, alpha: false });
  if (!gl) return;

  // =========================================================================
  // 1. VECTOR & MATRIX MATH
  // =========================================================================
  const V3 = {
    add: (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]],
    sub: (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]],
    mul: (a, s) => [a[0]*s, a[1]*s, a[2]*s],
    dot: (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2],
    cross: (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]],
    len: (a) => Math.hypot(a[0], a[1], a[2]),
    norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; },
    lerp: (a, b, t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]
  };

  const M4 = {
    ident() { const m = new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; },
    mul(a, b) {
      const o = new Float32Array(16);
      for (let c = 0; c < 4; c++) {
        for (let r = 0; r < 4; r++) {
          o[c*4+r] = a[0*4+r]*b[c*4+0] + a[1*4+r]*b[c*4+1] + a[2*4+r]*b[c*4+2] + a[3*4+r]*b[c*4+3];
        }
      }
      return o;
    },
    translate(x, y, z) { const m = M4.ident(); m[12]=x; m[13]=y; m[14]=z; return m; },
    scale(x, y, z) { const m = M4.ident(); m[0]=x; m[5]=y; m[10]=z; return m; },
    rotX(a) { const m = M4.ident(), c=Math.cos(a), s=Math.sin(a); m[5]=c; m[6]=s; m[9]=-s; m[10]=c; return m; },
    rotY(a) { const m = M4.ident(), c=Math.cos(a), s=Math.sin(a); m[0]=c; m[2]=-s; m[8]=s; m[10]=c; return m; },
    rotZ(a) { const m = M4.ident(), c=Math.cos(a), s=Math.sin(a); m[0]=c; m[1]=s; m[4]=-s; m[5]=c; return m; },
    perspective(fov, aspect, near, far) {
      const f = 1 / Math.tan(fov * 0.5), nf = 1 / (near - far);
      const m = new Float32Array(16);
      m[0] = f / aspect; m[5] = f; m[10] = (far + near) * nf; m[11] = -1; m[14] = 2 * far * near * nf;
      return m;
    },
    lookAt(eye, target, up) {
      const z = V3.norm(V3.sub(eye, target));
      const x = V3.norm(V3.cross(up, z));
      const y = V3.cross(z, x);
      const m = M4.ident();
      m[0]=x[0]; m[4]=x[1]; m[8]=x[2];   m[12]=-V3.dot(x, eye);
      m[1]=y[0]; m[5]=y[1]; m[9]=y[2];   m[13]=-V3.dot(y, eye);
      m[2]=z[0]; m[6]=z[1]; m[10]=z[2];  m[14]=-V3.dot(z, eye);
      return m;
    },
    normalMat3(m) {
      const a00=m[0], a01=m[1], a02=m[2], a10=m[4], a11=m[5], a12=m[6], a20=m[8], a21=m[9], a22=m[10];
      const b01 = a22*a11 - a12*a21;
      const b11 = -a22*a10 + a12*a20;
      const b21 = a21*a10 - a11*a20;
      let det = a00*b01 + a01*b11 + a02*b21;
      if (Math.abs(det) < 1e-8) det = 1;
      det = 1 / det;
      return new Float32Array([
        b01*det, (-a22*a01 + a02*a21)*det, (a12*a01 - a02*a11)*det,
        b11*det, (a22*a00 - a02*a20)*det, (-a12*a00 + a02*a10)*det,
        b21*det, (-a21*a00 + a01*a20)*det, (a11*a00 - a01*a10)*det
      ]);
    },
    transformPoint(m, p) {
      return [
        m[0]*p[0] + m[4]*p[1] + m[8]*p[2] + m[12],
        m[1]*p[0] + m[5]*p[1] + m[9]*p[2] + m[13],
        m[2]*p[0] + m[6]*p[1] + m[10]*p[2] + m[14]
      ];
    }
  };

  function catmullRom(pts, t) {
    const n = pts.length - 1;
    const f = Math.max(0, Math.min(n - 1e-6, t * n));
    const i = Math.floor(f);
    const u = f - i;
    const p0 = pts[Math.max(0, i - 1)];
    const p1 = pts[i];
    const p2 = pts[Math.min(n, i + 1)];
    const p3 = pts[Math.min(n, i + 2)];
    const u2 = u * u, u3 = u2 * u;
    const out = [];
    for (let k = 0; k < p1.length; k++) {
      out.push(0.5 * (
        (2 * p1[k]) +
        (-p0[k] + p2[k]) * u +
        (2*p0[k] - 5*p1[k] + 4*p2[k] - p3[k]) * u2 +
        (-p0[k] + 3*p1[k] - 3*p2[k] + p3[k]) * u3
      ));
    }
    return out;
  }

  // =========================================================================
  // 2. LINEAR-SPACE STUDIO PBR + CAD TECHNICAL EDGE SHADERS
  // =========================================================================
  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
    return sh;
  }
  function makeProg(vs, fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
    return p;
  }

  const pbrProg = makeProg(`
    precision highp float;
    attribute vec3 aPos;
    attribute vec3 aNorm;
    uniform mat4 uMVP;
    uniform mat4 uModel;
    uniform mat3 uNormMat;
    varying vec3 vWorldPos;
    varying vec3 vNorm;
    void main() {
      vec4 wp = uModel * vec4(aPos, 1.0);
      vWorldPos = wp.xyz;
      vNorm = normalize(uNormMat * aNorm);
      gl_Position = uMVP * vec4(aPos, 1.0);
    }
  `, `
    precision highp float;
    varying vec3 vWorldPos;
    varying vec3 vNorm;
    uniform vec3 uCamPos;
    uniform vec3 uColor;
    uniform float uMetal;
    uniform float uRough;
    uniform float uAlpha;
    uniform vec3 uEmissive;
    uniform float uHighlight;
    uniform float uGhost;

    const float PI = 3.14159265;

    float D_GGX(float NdotH, float r) {
      float a = r * r;
      float a2 = a * a;
      float d = (NdotH * NdotH) * (a2 - 1.0) + 1.0;
      return a2 / (PI * d * d + 1e-5);
    }
    float G_Schlick(float NdotV, float k) {
      return NdotV / (NdotV * (1.0 - k) + k + 1e-5);
    }
    vec3 F_Schlick(float cosT, vec3 F0) {
      return F0 + (1.0 - F0) * pow(clamp(1.0 - cosT, 0.0, 1.0), 5.0);
    }

    vec3 studioEnv(vec3 R, float rough) {
      float y = R.y;
      float strip1 = smoothstep(0.68 - rough*0.42, 0.94, dot(R, normalize(vec3(0.55, 0.72, 0.42))));
      float strip2 = smoothstep(0.60 - rough*0.42, 0.92, dot(R, normalize(vec3(-0.72, 0.48, -0.45))));
      float horizon = smoothstep(-0.18, 0.28, y);
      vec3 base = mix(vec3(0.52, 0.56, 0.62), vec3(0.95, 0.97, 1.0), horizon);
      float band = exp(-pow((y - 0.04) * 4.8, 2.0)) * (1.0 - rough * 0.65);
      base -= vec3(0.32, 0.34, 0.38) * band;
      base += vec3(0.75) * strip1 + vec3(0.45, 0.50, 0.58) * strip2;
      return clamp(base, 0.08, 1.85);
    }

    vec3 evalLight(vec3 N, vec3 V, vec3 L, vec3 lCol, vec3 albedo, float metal, float rough, vec3 F0) {
      vec3 H = normalize(V + L);
      float NdotL = max(dot(N, L), 0.0);
      float NdotV = max(dot(N, V), 0.001);
      float NdotH = max(dot(N, H), 0.0);
      float HdotV = max(dot(H, V), 0.0);
      float D = D_GGX(NdotH, rough);
      float k = (rough + 1.0) * (rough + 1.0) * 0.125;
      float G = G_Schlick(NdotV, k) * G_Schlick(NdotL, k);
      vec3 F = F_Schlick(HdotV, F0);
      vec3 spec = (D * G * F) / (4.0 * NdotV * NdotL + 0.001);
      vec3 kD = (1.0 - F) * (1.0 - metal);
      return (kD * albedo / PI + spec) * lCol * NdotL;
    }

    vec3 acesFilm(vec3 x) {
      return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
    }

    void main() {
      vec3 N = normalize(vNorm);
      if (!gl_FrontFacing) N = -N;
      vec3 V = normalize(uCamPos - vWorldPos);
      float NdotV = max(dot(N, V), 0.001);

      // Proper sRGB -> Linear albedo conversion for vivid, crisp CAD studio colors!
      vec3 albedo = pow(max(uColor, vec3(0.001)), vec3(2.2));
      float rough = clamp(uRough, 0.05, 0.96);
      vec3 F0 = mix(vec3(0.042), albedo, uMetal);

      vec3 Lo = vec3(0.0);
      Lo += evalLight(N, V, normalize(vec3(0.55, 0.78, 0.45)), vec3(2.45, 2.40, 2.32), albedo, uMetal, rough, F0);
      Lo += evalLight(N, V, normalize(vec3(-0.75, 0.45, 0.45)), vec3(1.15, 1.22, 1.32), albedo, uMetal, rough, F0);
      Lo += evalLight(N, V, normalize(vec3(-0.22, 0.55, -0.82)), vec3(1.25, 1.28, 1.35), albedo, uMetal, rough, F0);
      Lo += evalLight(N, V, normalize(vec3(0.0, -1.0, 0.15)), vec3(0.65, 0.66, 0.68), albedo, uMetal, rough, F0);

      vec3 R = reflect(-V, N);
      vec3 envSpec = studioEnv(R, rough);
      vec3 F_env = F_Schlick(NdotV, F0);
      vec3 hemi = mix(vec3(0.42, 0.45, 0.50), vec3(0.95, 0.96, 0.98), N.y * 0.5 + 0.5);
      vec3 ambient = (1.0 - F_env) * (1.0 - uMetal) * albedo * hemi * 0.68
                   + F_env * envSpec * mix(0.92, 0.28, rough) * mix(0.45, 1.15, uMetal);

      vec3 col = ambient + Lo + uEmissive;

      float fres = pow(1.0 - NdotV, 3.0);
      if (uMetal < 0.35 && uAlpha > 0.95) {
        col = mix(col, col * 0.84, fres * 0.30);
      }

      col += vec3(0.16, 0.28, 0.44) * fres * uHighlight + vec3(0.06) * uHighlight;

      col = acesFilm(col * 0.92);
      col = pow(clamp(col, 0.0, 1.0), vec3(1.0 / 2.2));

      float alpha = uAlpha;
      if (uAlpha < 0.98) {
        alpha = clamp(uAlpha + fres * 0.40, 0.08, 0.92);
      }
      if (uGhost > 0.5) {
        col = mix(vec3(0.88, 0.91, 0.94), col, 0.22);
        alpha = clamp(0.08 + fres * 0.25, 0.06, 0.34);
      }

      gl_FragColor = vec4(col, alpha);
    }
  `);

  const lineProg = makeProg(`
    precision highp float;
    attribute vec3 aPos;
    uniform mat4 uMVP;
    uniform float uBias;
    void main() {
      vec4 p = uMVP * vec4(aPos, 1.0);
      p.z -= uBias * p.w;
      gl_Position = p;
    }
  `, `
    precision highp float;
    uniform vec4 uColor;
    void main() { gl_FragColor = uColor; }
  `);

  const fxProg = makeProg(`
    precision highp float;
    attribute vec3 aPos;
    attribute vec4 aCol;
    uniform mat4 uMVP;
    varying vec4 vCol;
    void main() { vCol = aCol; gl_Position = uMVP * vec4(aPos, 1.0); }
  `, `
    precision highp float;
    varying vec4 vCol;
    void main() { gl_FragColor = vCol; }
  `);

  const shadowProg = makeProg(`
    precision highp float;
    attribute vec3 aPos;
    attribute vec2 aUV;
    uniform mat4 uMVP;
    varying vec2 vUV;
    void main() { vUV = aUV; gl_Position = uMVP * vec4(aPos, 1.0); }
  `, `
    precision highp float;
    varying vec2 vUV;
    uniform float uStrength;
    void main() {
      float d = length(vUV * vec2(1.0, 1.42));
      float a = smoothstep(1.0, 0.0, d);
      gl_FragColor = vec4(0.10, 0.14, 0.22, a * a * uStrength);
    }
  `);

  function getLocs(prog, attrs, unifs) {
    const l = { prog };
    for (const a of attrs) l[a] = gl.getAttribLocation(prog, a);
    for (const u of unifs) l[u] = gl.getUniformLocation(prog, u);
    return l;
  }

  const L_PBR = getLocs(pbrProg, ['aPos','aNorm'],
    ['uMVP','uModel','uNormMat','uCamPos','uColor','uMetal','uRough','uAlpha','uEmissive','uHighlight','uGhost']);
  const L_LINE = getLocs(lineProg, ['aPos'], ['uMVP','uBias','uColor']);
  const L_FX = getLocs(fxProg, ['aPos','aCol'], ['uMVP']);
  const L_SHAD = getLocs(shadowProg, ['aPos','aUV'], ['uMVP','uStrength']);

  // =========================================================================
  // 3. PROCEDURAL ULTRA-HIGH-PRECISION WATERTIGHT CAD MESH BUILDER (REV.2)
  // =========================================================================
  class MeshBuilder {
    constructor() {
      this.pos = []; this.norm = []; this.idx = []; this.explicitEdges = [];
    }
    _ensureOutward(startIdxCount) {

      const edgeBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, edgeBuf); gl.bufferData(gl.ARRAY_BUFFER, edgeArr, gl.STATIC_DRAW);

      return {
        posBuf, normBuf, idxBuf, edgeBuf,
        idxCount: idxArr.length,
        idxType: idxArr instanceof Uint32Array ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT,
        edgeVerts: edgeArr.length / 3
      };
    }
  }

  // =========================================================================
  // 4. ALL 58 PRECISION FLIGHT-READY CAD PARTS (EXACT 180 x 100 x 200 mm REV.2!)
  // =========================================================================
  const EX = -2.0;

  // Shared Rev.2 Shell Spine Control Points (Exact X=[-90,+90], Y=[0,200], Z=[-50,+50] w/ wings)
  const SHELL_CTRL_A = [
    [-90, 96.6], [-78, 95], [-56, 102], [-30, 111], [-2, 115],
    [16, 121], [19, 136], [12, 155], [7, 173], [16, 191], [29, 198.8], [37.4, 200]
  ];
  const SHELL_CTRL_B = [
    [-90, 95.4], [-76, 68], [-56, 39], [-32, 29], [-2, 28.5],
    [32, 35], [58, 67], [56, 108], [54, 134], [63, 155], [61, 179], [38.6, 200]
  ];
  const SHELL_CTRL_W = [
    [0.9], [18.0], [38.0], [45.0], [45.5],
    [42.5], [32.0], [22.5], [28.8], [31.0], [20.8], [0.9]
  ];
  const SHELL_WALL_MM = 1.25; // Autoclave PEEK-CF30 monocoque CFRP wall

  // Precomputed inner-shell cross-section lookup for exact shell-conformal packaging
  const _shellSlices = (() => {
    const out = [];
    for (let i = 0; i <= 220; i++) {
      const u = 0.01 + (i / 220) * 0.72;
      const A = catmullRom(SHELL_CTRL_A, u), B = catmullRom(SHELL_CTRL_B, u);
      const W = Math.max(0.15, catmullRom(SHELL_CTRL_W, u)[0]) - SHELL_WALL_MM;
      const Mx = (A[0] + B[0]) * 0.5, My = (A[1] + B[1]) * 0.5;
      const Hx = (A[0] - B[0]) * 0.5, Hy = (A[1] - B[1]) * 0.5;
      const hLen = Math.hypot(Hx, Hy) || 1;
      out.push([Mx, My, Hx / hLen, Hy / hLen, hLen - SHELL_WALL_MM, W]);
    }
    return out;
  })();

  function isInsideInnerShell(x, y, z, margin = 1.8) {
    let bestP = 1e9, bestK = -1;
    for (let k = 0; k < _shellSlices.length; k++) {
      const s = _shellSlices[k];
      const dx = x - s[0], dy = y - s[1];
      const perp = Math.abs(-dx * s[3] + dy * s[2]);
      if (perp < bestP) { bestP = perp; bestK = k; }
    }
    if (bestK < 0 || bestP > 2.5) return false;
    const s = _shellSlices[bestK];
    const hAllow = s[4] - margin, wAllow = s[5] - margin;
    if (hAllow <= 0 || wAllow <= 0) return false;
    const c = ((x - s[0]) * s[2] + (y - s[1]) * s[3]) / hAllow;
    if (Math.abs(c) >= 0.995) return false;
    const zLim = wAllow * Math.pow(Math.sqrt(1 - c * c), 0.90);
    return Math.abs(z) <= zLim;
  }

  function maxConformalRadius(ang, y, margin = 2.0) {
    const ca = Math.cos(ang), sa = Math.sin(ang);
    if (!isInsideInnerShell(EX + 31.2 * ca, y, 31.2 * sa, margin)) return 31.2;
    let lo = 31.2, hi = 82.0;
    for (let it = 0; it < 16; it++) {
      const mid = 0.5 * (lo + hi);
      if (isInsideInnerShell(EX + mid * ca, y, mid * sa, margin)) lo = mid; else hi = mid;
    }
    return lo;
  }

  // 4.1 Sculpted Watertight Split-Half CFRP Duck Monocoque Shell (1.25 mm wall, +3° mold draft)
  function buildDuckShellHalf(side) {
    const uSteps = 58, vSteps = 26, wallThick = SHELL_WALL_MM;
    const outerGrid = [], innerGrid = [];

    for (let ui = 0; ui <= uSteps; ui++) {
      const u = ui / uSteps;
      const A = catmullRom(SHELL_CTRL_A, u), B = catmullRom(SHELL_CTRL_B, u);
      const W = Math.max(0.15, catmullRom(SHELL_CTRL_W, u)[0]);
      const Mx = (A[0] + B[0]) * 0.5, My = (A[1] + B[1]) * 0.5;
      const Hx = (A[0] - B[0]) * 0.5, Hy = (A[1] - B[1]) * 0.5;

      const oRow = [], iRow = [];
      for (let vi = 0; vi <= vSteps; vi++) {
        const th = (vi / vSteps) * Math.PI;
        const c = Math.cos(th), s = Math.sin(th);
        const superS = Math.pow(Math.max(0, s), 0.90);
        const x = Mx + Hx * c, y = My + Hy * c;
        // Positive-draft gentle NACA shoulder flush inlet fairing (zero negative-draft mold lock!)
        const dxIn = (x - 18) / 16, dyIn = (y - 109) / 10;
        const scoop = Math.exp(-(dxIn * dxIn + dyIn * dyIn));
        let zOut = side * W * superS;
        if (Math.abs(zOut) > 16 && u > 0.36 && u < 0.62 && vi > 4 && vi < 13) {
          zOut -= side * scoop * 1.1;
        }
        oRow.push([x, y, zOut]);

        const tScale = Math.min(1, u * 10, (1 - u) * 10);
        const wt = wallThick * Math.max(0.25, tScale);
        const hLen = Math.hypot(Hx, Hy) || 1;
        const hShrink = Math.max(0.12, (hLen - wt) / hLen);
        const wShrink = Math.max(0.12, (W - wt) / (W || 1));
        iRow.push([Mx + Hx * c * hShrink, My + Hy * c * hShrink, zOut * wShrink]);
      }
      outerGrid.push(oRow); innerGrid.push(iRow);
    }

    function computeGridNormals(grid, flip) {
      const norms = [];
      for (let ui = 0; ui <= uSteps; ui++) {
        const row = [];
        for (let vi = 0; vi <= vSteps; vi++) {
          const du = V3.sub(grid[Math.min(uSteps, ui + 1)][vi], grid[Math.max(0, ui - 1)][vi]);
          const dv = V3.sub(grid[ui][Math.min(vSteps, vi + 1)], grid[ui][Math.max(0, vi - 1)]);
          let n = V3.cross(du, dv);
          if (flip) n = V3.mul(n, -1);
          const len = V3.len(n);
          row.push(len > 1e-6 ? V3.mul(n, 1 / len) : [0, 1, 0]);
        }
        norms.push(row);
      }
      return norms;
    }

    // Active cell mask: cut clean 26.2 mm radius belly opening for 24 mm ID ceramic heat shield
    const active = [];
    for (let ui = 0; ui < uSteps; ui++) {
      const row = [];
      for (let vi = 0; vi < vSteps; vi++) {
        const p00 = outerGrid[ui][vi], p11 = outerGrid[ui + 1][vi + 1];
        const cx = (p00[0] + p11[0]) * 0.5, cy = (p00[1] + p11[1]) * 0.5, cz = (p00[2] + p11[2]) * 0.5;
        row.push(!(cy < 33.5 && Math.hypot(cx - EX, cz) < 26.2));
      }
      active.push(row);
    }

    const mb = new MeshBuilder();
    const oNorms = computeGridNormals(outerGrid, side > 0);
    const iNorms = computeGridNormals(innerGrid, side < 0);

    mb.withSolid(() => {
      const bridgeEdge = (oa, ob, ia, ib) => {
        if (side > 0) mb.addQuad(oa, ob, ib, ia);
        else mb.addQuad(oa, ia, ib, ob);
      };
      for (let ui = 0; ui < uSteps; ui++) {
        for (let vi = 0; vi < vSteps; vi++) {
          if (!active[ui][vi]) continue;
          const o00 = outerGrid[ui][vi], o10 = outerGrid[ui + 1][vi];
          const o11 = outerGrid[ui + 1][vi + 1], o01 = outerGrid[ui][vi + 1];
          const i00 = innerGrid[ui][vi], i10 = innerGrid[ui + 1][vi];
          const i11 = innerGrid[ui + 1][vi + 1], i01 = innerGrid[ui][vi + 1];

          if (side > 0) {
            mb.addQuad(o00, o01, o11, o10, oNorms[ui][vi], oNorms[ui][vi + 1], oNorms[ui + 1][vi + 1], oNorms[ui + 1][vi]);
            mb.addQuad(i00, i10, i11, i01, iNorms[ui][vi], iNorms[ui + 1][vi], iNorms[ui + 1][vi + 1], iNorms[ui][vi + 1]);
          } else {
            mb.addQuad(o00, o10, o11, o01, oNorms[ui][vi], oNorms[ui + 1][vi], oNorms[ui + 1][vi + 1], oNorms[ui][vi + 1]);
            mb.addQuad(i00, i01, i11, i10, iNorms[ui][vi], iNorms[ui][vi + 1], iNorms[ui + 1][vi + 1], iNorms[ui + 1][vi]);
          }

          // Stitch EVERY exposed perimeter edge (z=0 rim, tail/crown tips, and belly aperture!) -> 100% watertight!
          if (ui === 0 || !active[ui - 1][vi]) bridgeEdge(o01, o00, i01, i00);
          if (ui === uSteps - 1 || !active[ui + 1][vi]) bridgeEdge(o10, o11, i10, i11);
          if (vi === 0 || !active[ui][vi - 1]) bridgeEdge(o00, o10, i00, i10);
          if (vi === vSteps - 1 || !active[ui][vi + 1]) bridgeEdge(o11, o01, i11, i01);
        }
      }
    });

    for (const ui of [15, 31, 43]) {
      for (let vi = 1; vi < vSteps - 1; vi++) mb.addEdge(outerGrid[ui][vi], outerGrid[ui][vi + 1]);
    }
    return mb.build(28);
  }

  // 4.2 Sculpted Watertight Aerodynamic Duck Beak (Exact X max = +90.0 mm)
  function buildBeak() {
    const mb = new MeshBuilder();
    const uSegs = 22, vSegs = 22, grid = [];
    for (let i = 0; i <= uSegs; i++) {
      const t = i / uSegs;
      const x = 57.5 + t * 32.5;
      const yCenter = 158.0 - Math.sin(t * Math.PI * 0.72) * 4.2 + t * t * 2.0;
      const halfH = Math.max(0.4, (1 - Math.pow(t, 1.45)) * 9.2 + Math.sin(t * Math.PI) * 1.4);
      const halfW = Math.max(0.6, Math.sin(Math.pow(1 - t, 0.55) * Math.PI * 0.52) * 16.5);
      const row = [];
      for (let j = 0; j <= vSegs; j++) {
        const ang = (j === vSegs) ? 0 : (j / vSegs) * Math.PI * 2;
        const ca = Math.cos(ang), sa = Math.sin(ang);
        row.push([x, yCenter + (sa > 0 ? sa * halfH * 1.15 : sa * halfH * 0.72), ca * halfW]);
      }
      grid.push(row);

    mb.withSolid(() => {
      for (let i = 0; i < uSegs; i++) {
        for (let j = 0; j < vSegs; j++) mb.addQuad(grid[i][j], grid[i + 1][j], grid[i + 1][j + 1], grid[i][j + 1]);
      }
      for (const [endI, flip] of [[0, false], [uSegs, true]]) {
        let cx = 0, cy = 0, cz = 0;
        for (let j = 0; j < vSegs; j++) { cx += grid[endI][j][0]; cy += grid[endI][j][1]; cz += grid[endI][j][2]; }
        const ctr = [cx / vSegs, cy / vSegs, cz / vSegs];
        for (let j = 0; j < vSegs; j++) {
          if (flip) mb.addTri(ctr, grid[endI][j + 1], grid[endI][j]);
          else mb.addTri(ctr, grid[endI][j], grid[endI][j + 1]);
        }
      }
    });
    for (let i = 1; i < uSegs - 1; i++) {
      mb.addEdge(grid[i][0], grid[i + 1][0]);
      mb.addEdge(grid[i][vSegs / 2], grid[i + 1][vSegs / 2]);
    }
    return mb.build(30);
  }

  // 4.12 HERO: Rev.3 5-Axis CNC 6+6 Splitter Ti-6Al-4V Centrifugal Compressor (Ø5 Bore, ~6.4 g Ultra-Low-Inertia + G0.4 Balance Collar!)
  function buildCompressorImpeller() {
    const mb = new MeshBuilder();
    // Constant-stress hyperbolic backplate w/ rear weight-relief pocket (0.48 mm rim web) & front ISO 1940 G0.4 balance trim collar
    mb.addLathe([
      [2.50, 5.7], [3.55, 5.7], [3.55, 4.7], [5.0, 2.4], [7.3, -0.5], [11.0, -2.3],
      [19.0, -3.02], [19.0, -3.50], [12.4, -3.44], [8.5, -2.5], [5.2, -2.2], [4.1, -3.5], [2.50, -3.5], [2.50, 5.7]
    ], 44, 0, 0, 0);

    function addImpellerBlade(baseAngle, startT, thick) {
      const steps = 10;
      const ptsH_L = [], ptsH_R = [], ptsS_L = [], ptsS_R = [];
      for (let i = 0; i <= steps; i++) {
        const t = startT + (1 - startT) * (i / steps);
        const rH = 5.4 + Math.pow(t, 1.25) * 13.6;
        const yH = 3.6 * Math.pow(1 - t, 1.60) - 2.8;
        const rS = 14.2 + t * 4.8;
        const yS = 4.6 * Math.pow(1 - t, 1.65) + 0.3;
        const sweepH = baseAngle + Math.pow(t, 1.35) * 0.68;
        const sweepS = baseAngle + 0.36 * (1 - t) + Math.pow(t, 1.35) * 0.72;
        const dAngH = thick / (2 * rH), dAngS = (thick * 0.68) / (2 * rS);
        ptsH_L.push([Math.cos(sweepH - dAngH) * rH, yH, Math.sin(sweepH - dAngH) * rH]);
        ptsH_R.push([Math.cos(sweepH + dAngH) * rH, yH, Math.sin(sweepH + dAngH) * rH]);
        ptsS_L.push([Math.cos(sweepS - dAngS) * rS, yS, Math.sin(sweepS - dAngS) * rS]);
        ptsS_R.push([Math.cos(sweepS + dAngS) * rS, yS, Math.sin(sweepS + dAngS) * rS]);
      }
      mb.withSolid(() => {
        for (let i = 0; i < steps; i++) {
          mb.addQuad(ptsH_L[i], ptsH_L[i + 1], ptsS_L[i + 1], ptsS_L[i]);
          mb.addQuad(ptsH_R[i + 1], ptsH_R[i], ptsS_R[i], ptsS_R[i + 1]);
          mb.addQuad(ptsS_L[i], ptsS_L[i + 1], ptsS_R[i + 1], ptsS_R[i]);
          mb.addQuad(ptsH_R[i], ptsH_R[i + 1], ptsH_L[i + 1], ptsH_L[i]);
        }
        mb.addQuad(ptsH_R[0], ptsH_L[0], ptsS_L[0], ptsS_R[0]);
        mb.addQuad(ptsH_L[steps], ptsH_R[steps], ptsS_R[steps], ptsS_L[steps]);
      });
    }

    // Authentic 6 Full + 6 Splitter = 12-Blade Micro-Jet Impeller (optimal 5-axis CNC channel access & 26% lower gyro inertia!)
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      addImpellerBlade(a, 0.0, 0.34);
      addImpellerBlade(a + Math.PI / 6, 0.42, 0.30);
    }
    return mb.build(28);
  }

  // 4.18 Watertight Axial Stator NGV (r_shroud_ID = 18.54 mm -> +0.34 mm cold turbine tip clearance!)

      const a = (i / 15) * Math.PI * 2, rIn = 11.25, rOut = 18.65, pts = [];

      mb.withSolid(() => {
        const th = 0.032;
        const ringInL = [], ringInR = [], ringOuL = [], ringOuR = [];
        for (let k = 0; k <= 4; k++) {
          const p = pts[k];
          ringInL.push([EX + Math.cos(p.a - th) * rIn, p.y, Math.sin(p.a - th) * rIn]);
          ringInR.push([EX + Math.cos(p.a + th) * rIn, p.y, Math.sin(p.a + th) * rIn]);
          ringOuL.push([EX + Math.cos(p.a - th) * rOut, p.y, Math.sin(p.a - th) * rOut]);
          ringOuR.push([EX + Math.cos(p.a + th) * rOut, p.y, Math.sin(p.a + th) * rOut]);
        }
        for (let k = 0; k < 4; k++) {
          mb.addQuad(ringInL[k], ringOuL[k], ringOuL[k + 1], ringInL[k + 1]);
          mb.addQuad(ringOuR[k], ringInR[k], ringInR[k + 1], ringOuR[k + 1]);
          mb.addQuad(ringInR[k], ringInL[k], ringInL[k + 1], ringInR[k + 1]);
          mb.addQuad(ringOuL[k], ringOuR[k], ringOuR[k + 1], ringOuL[k + 1]);

        mb.addQuad(ringInL[0], ringInR[0], ringOuR[0], ringOuL[0]);
        mb.addQuad(ringInR[4], ringInL[4], ringOuL[4], ringOuR[4]);
      });

    return mb.build(25);
  }

  // 4.19 HERO: Rev.3 Constant-Stress Bleed-Cooled Inconel 718 Turbine Blisk (17 Prime Blades, r_in=2.0 mm, G0.4 Balance Boss!)
  function buildTurbineWheel() {
    const mb = new MeshBuilder();
    // Hyperbolic Laval constant-stress disk (0.90 mm web, 1.80 mm rim) + rear ISO 1940 G0.4 balance trim collar
    mb.addLathe([
      [2.00, -3.05], [3.50, -3.05], [3.50, -2.2], [4.2, -1.9], [6.0, -0.45], [9.8, -0.45], [11.2, -0.90],
      [11.2, 0.90], [9.8, 0.45], [6.0, 0.45], [4.2, 1.9], [2.00, 2.4], [2.00, -3.05]
    ], 40, 0, 0, 0);
    // 17 prime-count blades (zero harmonic lock with 12 NGVs!) + 2:1 aerodynamic taper
    for (let i = 0; i < 17; i++) {
      const a = (i / 17) * Math.PI * 2, rIn = 10.9, rOut = 18.2, steps = 4;
      const fL = [], fR = [], bL = [], bR = [];
      for (let k = 0; k <= steps; k++) {
        const t = k / steps, r = rIn + (rOut - rIn) * t, twist = 0.52 + t * 0.25;
        const c = Math.cos(twist), s = Math.sin(twist);
        const chord = 1.78 * (1.0 - 0.48 * t), thick = 0.28 * (1.0 - 0.50 * t);
        const ca = Math.cos(a), sa = Math.sin(a), tx = -sa, tz = ca;
        const yLE = chord * c, tLE = -chord * s, yTE = -chord * c, tTE = chord * s;
        fL.push([ca * r + tx * (tLE - thick * c), yLE - thick * s, sa * r + tz * (tLE - thick * c)]);
        fR.push([ca * r + tx * (tLE + thick * c), yLE + thick * s, sa * r + tz * (tLE + thick * c)]);
        bL.push([ca * r + tx * (tTE - thick * c), yTE - thick * s, sa * r + tz * (tTE - thick * c)]);
        bR.push([ca * r + tx * (tTE + thick * c), yTE + thick * s, sa * r + tz * (tTE + thick * c)]);
      }
      mb.withSolid(() => {
        for (let k = 0; k < steps; k++) {
          mb.addQuad(fL[k], fL[k + 1], bL[k + 1], bL[k]); mb.addQuad(bR[k], bR[k + 1], fR[k + 1], fR[k]);
          mb.addQuad(fR[k], fR[k + 1], fL[k + 1], fL[k]); mb.addQuad(bL[k], bL[k + 1], bR[k + 1], bR[k]);
        }
        mb.addQuad(fR[0], fL[0], bL[0], bR[0]);
        mb.addQuad(fL[steps], fR[steps], bR[steps], bL[steps]);
      });
    }
    return mb.build(25);
  }

  // 4.24 290° Conformal Side-Saddle Horseshoe Fuel Tank (~140 mL Jet-A1, Centered CoG, Zero Shell/Baffle Clash!)
  function buildSaddleTank(isLiquid) {
    const mb = new MeshBuilder();
    const uSegs = 44, vSegs = 24;
    const aStart = Math.PI * 0.19, aEnd = Math.PI * 1.81;
    const wall = isLiquid ? 1.10 : 0.0;
    const margin = 2.55 + wall;
    const rInnerFixed = 31.4 + wall;
    const halfV = vSegs / 2;
    const rings = [];

    for (let i = 0; i <= uSegs; i++) {
      const t = i / uSegs;
      const ang = aStart + (aEnd - aStart) * t;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const taper = Math.sin(t * Math.PI);
      let yLo = 43.2 + 2.2 * (1 - taper);
      let yHi = 101.2 - 3.0 * (1 - taper);
      if (ca < -0.50) {
        yLo = 38.2 + 2.5 * (1 - taper);
      } else if (ca > 0.25) {
        yLo = 46.5 + 3.5 * (1 - taper);
        yHi = 94.5 - 3.0 * (1 - taper);
      }
      yLo += wall; yHi -= wall;

      const ring = [];
      for (let j = 0; j < vSegs; j++) {
        let y, r;
        if (j <= halfV) {
          const s = j / halfV;
          y = yLo + (yHi - yLo) * (0.5 - 0.5 * Math.cos(s * Math.PI));
          let rMaxSh = maxConformalRadius(ang, y, margin);
          // Trim rear tail X >= -61.5 mm to clear rear Cell 3 battery bay (X <= -63.0) & center CoG!
          if (ca < -0.15) rMaxSh = Math.min(rMaxSh, (-61.5 + wall - EX) / ca);
          // Strictly clear chest firewall (X=26.7) and front battery cells (X>=31.2)!
          if (ca > 0.02) rMaxSh = Math.min(rMaxSh, (24.4 - wall - EX) / ca);
          const rSpan = Math.max(0.8, (rMaxSh - rInnerFixed) * (0.28 + 0.72 * Math.pow(taper, 0.18)));
          r = Math.max(rInnerFixed + 0.5, rInnerFixed + rSpan * Math.pow(Math.sin(s * Math.PI), 0.16));
        } else {
          const s = (j - halfV) / halfV;
          y = yHi - (yHi - yLo) * (0.5 - 0.5 * Math.cos(s * Math.PI));
          r = rInnerFixed;
        }
        ring.push([EX + ca * r, y, sa * r]);
      }
      rings.push(ring);
    }

    mb.withSolid(() => {
      for (let i = 0; i < uSegs; i++) {
        for (let j = 0; j < vSegs; j++) {
          const jn = (j + 1) % vSegs;
          mb.addQuad(rings[i][j], rings[i + 1][j], rings[i + 1][jn], rings[i][jn]);
        }
      }
      for (const [endI, flip] of [[0, false], [uSegs, true]]) {
        let cx = 0, cy = 0, cz = 0;
        for (let j = 0; j < vSegs; j++) { cx += rings[endI][j][0]; cy += rings[endI][j][1]; cz += rings[endI][j][2]; }
        const ctr = [cx / vSegs, cy / vSegs, cz / vSegs];
        for (let j = 0; j < vSegs; j++) {
          const jn = (j + 1) % vSegs;
          if (flip) mb.addTri(ctr, rings[endI][jn], rings[endI][j]);
          else mb.addTri(ctr, rings[endI][j], rings[endI][jn]);
        }
      }
    });
    if (!isLiquid) {
      mb.addCylinder(-44, 95.0, 98.0, 3.4, 3.4, 16, 0, true, true);
      mb.addCylinder(-44, 98.0, 99.5, 4.0, 4.0, 12, 0, true, true);
    }
    return mb.build(28);
  }

      state.yawGoal -= dx * 0.0075;
      state.pitchGoal = Math.max(-1.35, Math.min(1.35, state.pitchGoal + dy * 0.0075));

  const guideBuf = gl.createBuffer();

  const fxColBuf = gl.createBuffer();

  function pushRibbonSegment(posOut, colOut, p0, p1, halfW, camDir, c0, c1) {
    const dir = V3.sub(p1, p0);
    const side = V3.norm(V3.cross(dir, camDir));
    const s0 = V3.mul(side, halfW), s1 = V3.mul(side, halfW * 0.65);
    const a = V3.sub(p0, s0), b = V3.add(p0, s0), c = V3.add(p1, s1), d = V3.sub(p1, s1);
    posOut.push(...a, ...b, ...c, ...a, ...c, ...d);
    colOut.push(...c0, ...c0, ...c1, ...c0, ...c1, ...c1);
  }

  function buildDynamicFX(camPos, bodyMat, nozzleMat, thr, exp, t, rcsPulse) {
    const pArr = [], cArr = [];
    if (!state.showFlow || thr < 0.03) return { pArr, cArr };
    const camDir = V3.norm(V3.sub(camPos, [0, 80, 0]));

    // 1. Cool Cyan Intake Airflow Streamlines (Raised Y=109.5 mm NACA Shoulder Scoops)
    for (const side of [-1, 1]) {
      for (let k = 0; k < 6; k++) {
        const ph = ((t * (0.9 + thr * 1.4) + k / 6 + (side > 0 ? 0.25 : 0)) % 1);
        const pathPts = [
          [38 - state.cruiseMix * 12, 114, side * 46],
          [22, 111, side * 31],
          [12, 109.5 + exp * 68, side * 22],
          [EX + 3, 105 + exp * 60, side * 11],
          [EX + Math.cos(ph * 10) * 9, 92 + exp * 50, Math.sin(ph * 10) * 9]
        ];
        const q0 = M4.transformPoint(bodyMat, catmullRom(pathPts, ph));
        const q1 = M4.transformPoint(bodyMat, catmullRom(pathPts, Math.min(0.99, ph + 0.14)));
        const fade = Math.sin(ph * Math.PI) * Math.min(1, thr * 1.4);
        pushRibbonSegment(pArr, cArr, q0, q1, 1.35, camDir,
          [0.02, 0.58, 0.94, 0.0], [0.02, 0.58, 0.94, 0.72 * fade]);
      }
    }

    // 2. Pressurized Violet-Blue Cooling-Jacket Air
    for (let k = 0; k < 10; k++) {
      const ph = ((t * (1.2 + thr * 1.5) + k / 10) % 1);
      const ang = (k / 10) * Math.PI * 2 + ph * 1.2;
      const y0 = 88 + exp * 28 - ph * (24 + exp * 28);
      const q0 = M4.transformPoint(bodyMat, [EX + Math.cos(ang)*21.2, y0, Math.sin(ang)*21.2]);
      const q1 = M4.transformPoint(bodyMat, [EX + Math.cos(ang+0.25)*21.2, y0 - 6.2, Math.sin(ang+0.25)*21.2]);
      const fade = Math.sin(ph * Math.PI) * thr;
      pushRibbonSegment(pArr, cArr, q0, q1, 1.15, camDir,
        [0.20, 0.36, 0.95, 0.0], [0.28, 0.42, 0.98, 0.58 * fade]);
    }

    // 3. Swirling Hot Amber-Orange Combustion Streaks inside Annular Flame Tube
    for (let k = 0; k < 12; k++) {
      const ph = ((t * (1.8 + thr * 2.2) + k / 12) % 1);
      const ang = (k / 12) * Math.PI * 2 + ph * 3.8;
      const y0 = 66 + ph * 15;
      const q0 = M4.transformPoint(bodyMat, [EX + Math.cos(ang)*15.2, y0, Math.sin(ang)*15.2]);
      const q1 = M4.transformPoint(bodyMat, [EX + Math.cos(ang+0.55)*15.2, y0 + 3.5, Math.sin(ang+0.55)*15.2]);
      const fade = Math.sin(ph * Math.PI) * thr;
      pushRibbonSegment(pArr, cArr, q0, q1, 1.55, camDir,
        [1.0, 0.38, 0.02, 0.0], [1.0, 0.68, 0.08, 0.88 * fade]);
    }

    // 4. Crisp High-Contrast Supersonic Exhaust Plume + Vivid Cobalt Mach Shock Diamonds!
    const plumeLen = 24 + thr * 56;
    const rings = 14, segs = 18, plumeRings = [];
    for (let i = 0; i <= rings; i++) {
      const u = i / rings;
      const yLoc = -17.0 - u * plumeLen;
      const shock = 1.0 + Math.sin(u * Math.PI * 5.2 - t * 24) * 0.13 * (1 - u);
      const r = (8.6 * (1 - u * 0.72) + 1.2) * shock;
      const ring = [];
      for (let j = 0; j <= segs; j++) {
        const a = (j / segs) * Math.PI * 2;
        ring.push(M4.transformPoint(nozzleMat, [Math.cos(a) * r, yLoc, Math.sin(a) * r]));
      }
      plumeRings.push({ ring, u });
    }
    for (let i = 0; i < rings; i++) {
      const r0 = plumeRings[i], r1 = plumeRings[i + 1], u0 = r0.u, u1 = r1.u;
      const a0 = Math.pow(1 - u0, 1.25) * (0.35 + thr * 0.55);
      const a1 = Math.pow(1 - u1, 1.25) * (0.35 + thr * 0.55);
      const c0 = [1.0, 0.42 - u0 * 0.25, 0.04, a0];
      const c1 = [1.0, 0.42 - u1 * 0.25, 0.04, a1];
      for (let j = 0; j < segs; j++) {
        pArr.push(...r0.ring[j], ...r0.ring[j+1], ...r1.ring[j+1],
                  ...r0.ring[j], ...r1.ring[j+1], ...r1.ring[j]);
        cArr.push(...c0, ...c0, ...c1, ...c0, ...c1, ...c1);
      }
    }
    if (thr > 0.28) {
      for (let d = 0; d < 3; d++) {
        const yMid = -22 - d * (10 + thr * 11);
        const rad = (4.6 - d * 0.95) * thr;
        const h = 5.5 + thr * 4.0;
        const top = M4.transformPoint(nozzleMat, [0, yMid + h, 0]);
        const bot = M4.transformPoint(nozzleMat, [0, yMid - h, 0]);
        const cPeak = [0.10, 0.52, 1.0, 0.88 * thr * (1 - d * 0.18)];
        const cTip  = [0.95, 0.65, 0.15, 0.0];
        for (let j = 0; j < 8; j++) {
          const a0 = (j / 8) * Math.PI * 2, a1 = ((j + 1) / 8) * Math.PI * 2;
          const m0 = M4.transformPoint(nozzleMat, [Math.cos(a0)*rad, yMid, Math.sin(a0)*rad]);
          const m1 = M4.transformPoint(nozzleMat, [Math.cos(a1)*rad, yMid, Math.sin(a1)*rad]);
          pArr.push(...top, ...m0, ...m1, ...bot, ...m1, ...m0);
          cArr.push(...cTip, ...cPeak, ...cPeak, ...cTip, ...cPeak, ...cPeak);
        }
      }
    }

    // 5. Cold-Air Tail & Wingtip Yaw RCS Stabilization Puffs
    const rcsSide = rcsPulse >= 0 ? 1 : -1;
    const rcsAmp = Math.min(1, Math.abs(rcsPulse) * 1.4) * thr;
    if (rcsAmp > 0.14) {
      for (const [o, dir] of [
        [[-82 - exp * 34, 85 + exp * 24, rcsSide * 11], [0, 0, rcsSide * (18 * rcsAmp)]],
        [[-12 - exp * 34, 72 + exp * 24, -rcsSide * 47], [0, 0, -rcsSide * (14 * rcsAmp)]]
      ]) {
        pushRibbonSegment(pArr, cArr,
          M4.transformPoint(bodyMat, o), M4.transformPoint(bodyMat, V3.add(o, dir)),
          3.1 * rcsAmp, camDir, [0.06, 0.64, 0.98, 0.64 * rcsAmp], [0.45, 0.82, 1.0, 0.0]);
      }
    }
    return { pArr, cArr };
  }

  // =========================================================================
  // 8. 60 FPS RENDER LOOP
  // =========================================================================
  let prevTime = performance.now();

  function drawMesh(mesh, modelMat, vpMat, camPos, opts) {
    const mvp = M4.mul(vpMat, modelMat);
    const nMat = M4.normalMat3(modelMat);

    gl.useProgram(pbrProg);
    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.posBuf);
    gl.enableVertexAttribArray(L_PBR.aPos);
    gl.vertexAttribPointer(L_PBR.aPos, 3, gl.FLOAT, false, 0, 0);

    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.normBuf);
    gl.enableVertexAttribArray(L_PBR.aNorm);
    gl.vertexAttribPointer(L_PBR.aNorm, 3, gl.FLOAT, false, 0, 0);

    gl.uniformMatrix4fv(L_PBR.uMVP, false, mvp);
    gl.uniformMatrix4fv(L_PBR.uModel, false, modelMat);
    gl.uniformMatrix3fv(L_PBR.uNormMat, false, nMat);
    gl.uniform3fv(L_PBR.uCamPos, camPos);
    gl.uniform3fv(L_PBR.uColor, opts.color);
    gl.uniform1f(L_PBR.uMetal, opts.metal);
    gl.uniform1f(L_PBR.uRough, opts.rough);
    gl.uniform1f(L_PBR.uAlpha, opts.alpha);
    gl.uniform3fv(L_PBR.uEmissive, opts.emissive);
    gl.uniform1f(L_PBR.uHighlight, opts.highlight);
    gl.uniform1f(L_PBR.uGhost, opts.ghost);

    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.idxBuf);
    gl.drawElements(gl.TRIANGLES, mesh.idxCount, mesh.idxType, 0);

    if (state.showEdges && mesh.edgeVerts > 0 && !opts.noEdges) {
      gl.useProgram(lineProg);
      gl.bindBuffer(gl.ARRAY_BUFFER, mesh.edgeBuf);
      gl.enableVertexAttribArray(L_LINE.aPos);
      gl.vertexAttribPointer(L_LINE.aPos, 3, gl.FLOAT, false, 0, 0);
      gl.uniformMatrix4fv(L_LINE.uMVP, false, mvp);
      gl.uniform1f(L_LINE.uBias, 0.00042);
      const edgeA = opts.ghost > 0.5 ? 0.13 : (opts.alpha < 0.95 ? 0.22 : 0.34);
      gl.uniform4f(L_LINE.uColor, 0.10, 0.14, 0.22, edgeA);
      gl.drawArrays(gl.LINES, 0, mesh.edgeVerts);
    }
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - prevTime) * 0.001);
    prevTime = now;
    resize();

    const damp = 1 - Math.exp(-dt * 12.0);
    state.explode += (state.explodeTarget - state.explode) * damp;
    if (Math.abs(state.explode - state.explodeTarget) < 0.002) state.explode = state.explodeTarget;
    state.throttle += (state.throttleTarget - state.throttle) * damp;
    state.cruiseMix += ((state.cruise ? 1 : 0) - state.cruiseMix) * damp;
    state.yaw += (state.yawGoal - state.yaw) * damp;
    state.pitch += (state.pitchGoal - state.pitch) * damp;
    state.dist += (state.distGoal - state.dist) * damp;
    for (let i = 0; i < 3; i++) state.target[i] += (state.targetGoal[i] - state.target[i]) * damp;

    if (state.playing) {
      state.time += dt;
      const rpmSpeed = state.throttle > 0.02 ? (4.5 + state.throttle * 26.0) : 0;
      state.rotorAngle += dt * rpmSpeed;
    }

    const t = state.time, thr = state.throttle, exp = state.explode;
    const liftFactor = Math.max(0, (thr - 0.44) / 0.56);
    const bodyCalm = 1.0 - Math.min(0.88, exp * 1.25);
    const hoverY = liftFactor * (12.0 + Math.sin(t * 2.4) * 3.5 + Math.sin(t * 4.1) * 1.1) * bodyCalm;
    const bodyPitch = (-0.31 * state.cruiseMix + Math.sin(t * 2.1) * 0.042 * liftFactor) * bodyCalm;
    const bodyRoll  = (Math.cos(t * 1.7) * 0.036 * liftFactor) * bodyCalm;
    const nozPitch = (0.24 * state.cruiseMix - Math.sin(t * 2.1) * 0.16 * (0.25 + liftFactor * 0.75)) * (thr > 0.05 ? 1 : 0);
    const nozRoll  = (-Math.cos(t * 1.7) * 0.15 * (0.25 + liftFactor * 0.75)) * (thr > 0.05 ? 1 : 0);
    const rcsPulse = Math.sin(t * 3.1) * (0.35 + liftFactor * 0.65);

    let bodyMat = M4.ident();
    bodyMat = M4.mul(bodyMat, M4.translate(EX, 84 + hoverY, 0));
    bodyMat = M4.mul(bodyMat, M4.rotZ(bodyPitch));
    bodyMat = M4.mul(bodyMat, M4.rotX(bodyRoll));
    bodyMat = M4.mul(bodyMat, M4.translate(-EX, -84, 0));

    // Smooth auto-zoom compensation so 0%..100% exploded anatomy always fits cleanly above bottom dock!
    const effDist = state.dist * (1.0 + exp * 0.72);
    const effTarget = [state.target[0], state.target[1] - exp * 22, state.target[2]];
    const camPos = [
      effTarget[0] + effDist * Math.cos(state.pitch) * Math.cos(state.yaw),
      effTarget[1] + effDist * Math.sin(state.pitch),
      effTarget[2] + effDist * Math.cos(state.pitch) * Math.sin(state.yaw)
    ];
    const aspect = canvas.width / Math.max(1, canvas.height);
    const proj = M4.perspective(34 * Math.PI / 180, aspect, 4, 2800);
    const view = M4.lookAt(camPos, effTarget, [0, 1, 0]);
    const vpMat = M4.mul(proj, view);

    // PURE SOLID WHITE #FFFFFF BACKGROUND
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(1.0, 1.0, 1.0, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    // 1. Subtle ground contact shadow (fades cleanly when hovering or exploded)
    const shadStrength = Math.max(0.01, 0.14 * (1 - liftFactor * 0.55) * (1 - exp * 0.85));
    gl.depthMask(false);
    gl.useProgram(shadowProg);
    const shScale = 1.0 + liftFactor * 0.35;
    gl.uniformMatrix4fv(L_SHAD.uMVP, false, M4.mul(vpMat, M4.mul(M4.translate(2, 0.2, 0), M4.scale(shScale, 1, shScale))));
    gl.uniform1f(L_SHAD.uStrength, shadStrength);
    gl.bindBuffer(gl.ARRAY_BUFFER, shadowGeo.pb);
    gl.enableVertexAttribArray(L_SHAD.aPos); gl.vertexAttribPointer(L_SHAD.aPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, shadowGeo.ub);
    gl.enableVertexAttribArray(L_SHAD.aUV); gl.vertexAttribPointer(L_SHAD.aUV, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
    gl.depthMask(true);

    const opaqueQueue = [], transQueue = [], guideVerts = [];
    let nozzleWorldMat = bodyMat;
    const nozRotMat = M4.mul(M4.rotZ(nozPitch), M4.rotX(nozRoll));

    for (const p of parts) {
      // Half-Cutaway mode cleanly removes near-side left shell & thermal shroud at ALL explode levels!
      if (state.shellMode === 1 && (p.isShell === 'left' || p.isShell === 'wingL' || p.isCutawayHide)) continue;

      const ex = p.explode[0] * exp, ey = p.explode[1] * exp, ez = p.explode[2] * exp;
      let localMat = M4.translate(ex, ey, ez);
      if (p.basePos) localMat = M4.mul(localMat, M4.translate(p.basePos[0], p.basePos[1], p.basePos[2]));

      if (p.anim === 'rotor') localMat = M4.mul(localMat, M4.rotY(state.rotorAngle));
      else if (p.anim === 'bearing') localMat = M4.mul(localMat, M4.rotY(state.rotorAngle * 0.46));
      else if (p.anim === 'gear1') localMat = M4.mul(localMat, M4.rotY(state.rotorAngle * 0.35));
      else if (p.anim === 'gear2') localMat = M4.mul(localMat, M4.rotY(-state.rotorAngle * 0.35));
      else if (p.anim === 'gimbalPitch') localMat = M4.mul(localMat, M4.rotZ(nozPitch));
      else if (p.anim === 'gimbalFull') localMat = M4.mul(localMat, nozRotMat);
      else if (p.anim === 'servoR' || p.anim === 'servoL') {
        const s = (p.anim === 'servoR') ? 1 : -1;
        const h0 = [12.5, -1.5, s * 9.5];
        const h1 = M4.transformPoint(nozRotMat, h0);
        localMat = M4.mul(localMat, M4.translate(h1[0] - h0[0], h1[1] - h0[1], h1[2] - h0[2]));
      }
      else if (p.anim === 'flapR') localMat = M4.mul(localMat, M4.rotZ(0.32 * state.cruiseMix + nozRoll * 0.75));
      else if (p.anim === 'flapL') localMat = M4.mul(localMat, M4.rotZ(0.32 * state.cruiseMix - nozRoll * 0.75));
      else if (p.anim === 'tail')  localMat = M4.mul(localMat, M4.rotZ(-0.26 * state.cruiseMix - nozPitch * 0.65));
      else if (p.anim === 'foot')  localMat = M4.mul(localMat, M4.translate(0, -liftFactor * 3.0 * (1 - exp), 0));

      const worldMat = M4.mul(bodyMat, localMat);
      if (p.name === 'nozzle') nozzleWorldMat = worldMat;

      if (exp > 0.08 && (Math.abs(ex) + Math.abs(ey) + Math.abs(ez)) > 8) {
        const a0 = M4.transformPoint(bodyMat, p.anchor);
        const a1 = M4.transformPoint(bodyMat, [p.anchor[0] + ex, p.anchor[1] + ey, p.anchor[2] + ez]);
        for (let s = 0; s < 9; s += 2) {
          guideVerts.push(...V3.lerp(a0, a1, s / 9), ...V3.lerp(a0, a1, Math.min(1, (s + 1) / 9)));
        }
      }

      const isIsoOut = state.isolatedGroup !== null && state.isolatedGroup !== p.group;
      const isHi = state.isolatedGroup !== null && state.isolatedGroup === p.group;
      let alpha = p.alpha, ghost = isIsoOut ? 1.0 : 0.0, noEdges = false, emissive = [0, 0, 0];

      if (state.shellMode === 2 && p.isShell) alpha = 0.16;
      if (p.heatGlow && thr > 0.18) {
        const g = Math.pow((thr - 0.18) / 0.82, 1.4) * p.heatGlow;
        emissive = [g * 1.15, g * 0.28, g * 0.03];
      }
      if (p.isPlasma) {
        if (thr < 0.05) continue;
        const flick = 0.86 + 0.14 * Math.sin(t * 38.0);
        alpha = (0.26 + thr * 0.62) * flick;
        emissive = [1.85 * thr * flick, 0.72 * thr * flick, 0.18 * thr * flick];
        noEdges = true;
      }

      const item = {
        mesh: p.mesh, worldMat,
        opts: { color: p.color, metal: p.metal, rough: p.rough, alpha, emissive, highlight: isHi ? 1.0 : 0.0, ghost, noEdges }
      };
      if (alpha < 0.98 || ghost > 0.5 || p.isTransparent || p.isPlasma) transQueue.push(item);
      else opaqueQueue.push(item);
    }

    for (const it of opaqueQueue) drawMesh(it.mesh, it.worldMat, vpMat, camPos, it.opts);

    if (guideVerts.length > 0) {
      gl.useProgram(lineProg);
      gl.bindBuffer(gl.ARRAY_BUFFER, guideBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(guideVerts), gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(L_LINE.aPos); gl.vertexAttribPointer(L_LINE.aPos, 3, gl.FLOAT, false, 0, 0);
      gl.uniformMatrix4fv(L_LINE.uMVP, false, vpMat);
      gl.uniform1f(L_LINE.uBias, 0.0);
      gl.uniform4f(L_LINE.uColor, 0.50, 0.56, 0.66, Math.min(0.45, exp * 0.55));
      gl.drawArrays(gl.LINES, 0, guideVerts.length / 3);
    }

    gl.depthMask(false);
    for (const it of transQueue) drawMesh(it.mesh, it.worldMat, vpMat, camPos, it.opts);

    const fx = buildDynamicFX(camPos, bodyMat, nozzleWorldMat, thr, exp, t, rcsPulse);
    if (fx.pArr.length > 0) {
      gl.useProgram(fxProg);
      gl.uniformMatrix4fv(L_FX.uMVP, false, vpMat);
      gl.bindBuffer(gl.ARRAY_BUFFER, fxPosBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(fx.pArr), gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(L_FX.aPos); gl.vertexAttribPointer(L_FX.aPos, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, fxColBuf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(fx.cArr), gl.DYNAMIC_DRAW);
      gl.enableVertexAttribArray(L_FX.aCol); gl.vertexAttribPointer(L_FX.aCol, 4, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.TRIANGLES, 0, fx.pArr.length / 3);
    }
    gl.depthMask(true);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
